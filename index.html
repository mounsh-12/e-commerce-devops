
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Simple E-commerce Clothing Store">
    <title>Clothing Store | Simple E-Commerce Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🛍️ Simple E-Commerce Clothing Store</h1>
</header>

<main>

    <!-- Login Page -->
    <section id="loginPage" class="container">
        <h2>Login</h2>

        <label for="loginEmail">Email</label>
        <input
            type="email"
            id="loginEmail"
            placeholder="Email"
            autocomplete="username"
            required
        >

        <label for="loginPassword">Password</label>
        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            autocomplete="current-password"
            required
        >

        <button type="button" onclick="login()">Login</button>

        <div class="link">
            <p>
                Don't have an account?
                <button
                    type="button"
                    class="link-button"
                    onclick="showSignup()"
                >
                    Sign Up
                </button>
            </p>
        </div>
    </section>

    <!-- Signup Page -->
    <section id="signupPage" class="container" style="display:none;">
        <h2>Sign Up</h2>

        <label for="signupName">Full Name</label>
        <input
            type="text"
            id="signupName"
            placeholder="Full Name"
            autocomplete="name"
            required
        >

        <label for="signupEmail">Email</label>
        <input
            type="email"
            id="signupEmail"
            placeholder="Email"
            autocomplete="email"
            required
        >

        <label for="signupPassword">Password</label>
        <input
            type="password"
            id="signupPassword"
            placeholder="Password"
            autocomplete="new-password"
            required
        >

        <button type="button" onclick="signup()">Create Account</button>

        <div class="link">
            <p>
                Already have an account?
                <button
                    type="button"
                    class="link-button"
                    onclick="showLogin()"
                >
                    Login
                </button>
            </p>
        </div>
    </section>

    <!-- Store Page -->
    <section id="storePage" style="display:none;">

        <h2 class="store-heading">
            Welcome to Our Clothing Store 👕
        </h2>

        <div class="products" id="productList"></div>

        <!-- Shopping Cart -->
        <div id="cart">

            <h3>🛒 Shopping Cart</h3>

            <ul id="cartItems"></ul>

            <h4>Total: ₹<span id="total">0</span></h4>

            <!-- Checkout -->
            <div class="payment">

                <h4>Checkout</h4>

                <label for="custName">Full Name</label>
                <input
                    type="text"
                    id="custName"
                    placeholder="Full Name"
                    autocomplete="name"
                >

                <label for="custAddress">Delivery Address</label>
                <input
                    type="text"
                    id="custAddress"
                    placeholder="Delivery Address"
                    autocomplete="street-address"
                >

                <label for="paymentMethod">Payment Method</label>
                <select id="paymentMethod">
                    <option value="">Select Payment Method</option>
                    <option value="gpay">Google Pay</option>
                    <option value="paytm">Paytm</option>
                    <option value="phonepe">PhonePe</option>
                    <option value="cod">Cash on Delivery</option>
                </select>

                <button
                    type="button"
                    onclick="proceedToPayment()"
                >
                    Proceed to Payment
                </button>

            </div>

            <button
                type="button"
                class="logout-button"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
