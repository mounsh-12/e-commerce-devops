
# SonarQube Project Configuration
sonar.projectKey=ecommerce-devops
sonar.projectName=E-commerce DevOps Project
sonar.projectVersion=1.0

# Application source
sonar.sources=.

sonar.sourceEncoding=UTF-8

# Exclude generated files, test infrastructure and coverage tooling
sonar.exclusions=**/node_modules/**,**/coverage/**,**/playwright-report/**,**/test-results/**,**/tests/**,**/e2e/**,scripts/generate-coverage.js,playwright.config.js

# Playwright LCOV report
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Only application code should contribute to coverage
sonar.coverage.exclusions=**/tests/**,**/e2e/**,**/*.test.js,**/*.spec.js,scripts/generate-coverage.js,playwright.config.js

# SCM configuration
sonar.scm.exclusions.disabled=false
