
sonar.projectKey=ecommerce-devops
sonar.projectName=E-commerce DevOps Project
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

# Application source code
sonar.sources=.

# Playwright test files
sonar.tests=tests
sonar.test.inclusions=**/*.spec.js

# Exclude generated files and configuration from application source analysis
sonar.exclusions=jenkins/**,node_modules/**,coverage/**,playwright-report/**,test-results/**,playwright.config.js

# Files that do not have JavaScript coverage instrumentation
sonar.coverage.exclusions=**/*.html,**/*.css,playwright.config.js

sonar.scm.provider=git
