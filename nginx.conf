
server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Application routing
    location / {
        try_files $uri $uri/ =404;
    }

    # Static asset caching
    location ~* \.(css|js|html)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Disable server version disclosure
    server_tokens off;
}
